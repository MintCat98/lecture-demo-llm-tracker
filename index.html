<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>할인 소식 트래커 (데모)</title>
<style>
  body { font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; max-width: 1100px; margin: 24px auto; padding: 0 16px; color: #1a1a1a; background: #fafaf7; font-size: 15px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .meta { color: #666; font-size: 13px; margin-bottom: 16px; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
  input { flex: 1; min-width: 260px; padding: 8px; font-size: 15px; border: 1px solid #ccc; }
  button { padding: 8px 12px; font-size: 14px; border: 1px solid #1f4e79; background: #fff; color: #1f4e79; cursor: pointer; }
  button.primary { background: #1f4e79; color: #fff; }
  #status { font-size: 13px; color: #1f4e79; min-height: 18px; margin-bottom: 12px; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  @media (max-width: 800px) { .cols { grid-template-columns: 1fr; } }
  h2 { font-size: 16px; border-bottom: 2px solid #1a1a1a; padding-bottom: 6px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { padding: 10px 0; border-bottom: 1px solid #e3e3e3; }
  li a { color: #1a1a1a; text-decoration: none; }
  li a:hover { text-decoration: underline; }
  .sub { font-size: 12px; color: #666; margin-top: 3px; }
  .price { color: #1f4e79; font-weight: 600; }
  .why { font-size: 12px; color: #2e7d32; margin-top: 3px; }
  li.hidden { display: none; }
  li.dim { opacity: .35; }
</style>
</head>
<body>
<h1>할인 소식 트래커 <small style="font-weight:400;color:#888">데모</small></h1>
<div class="meta" id="meta">불러오는 중…</div>

<div class="bar">
  <input id="interests" placeholder="관심사를 쉼표로 (예: 커피, 청소기, 노트북)">
  <button onclick="keywordFilter()">키워드로 거르기</button>
  <button class="primary" onclick="aiFilter()">AI로 거르기</button>
  <button onclick="showAll()">전체 보기</button>
</div>
<div id="status"></div>
<div class="meta" id="diag"></div>

<div class="cols">
  <section><h2>뽐뿌 핫딜 <span id="n-pp"></span></h2><ul id="pp"></ul></section>
  <section><h2>뉴스 <span id="n-gn"></span></h2><ul id="gn"></ul></section>
</div>

<script>
let items = [];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const status = msg => { $('status').textContent = msg; };

// 관심사는 이 브라우저에만 저장
try { $('interests').value = localStorage.getItem('interests') || '커피, 청소기, 노트북'; } catch (e) {}
const getInterests = () => {
  const v = $('interests').value;
  try { localStorage.setItem('interests', v); } catch (e) {}
  return v.split(',').map(s => s.trim()).filter(Boolean);
};

async function load() {
  const res = await fetch('data.json?t=' + Date.now());
  const data = await res.json();
  items = data.items;
  $('meta').textContent = `마지막 수집: ${data.updated.replace('T', ' ').slice(0, 16)} · 총 ${items.length}건` +
    (data.errors.length ? ` · 수집 오류: ${data.errors.join(' / ')}` : '');
  render();
}

function render() {
  for (const [src, el] of [['뽐뿌', 'pp'], ['뉴스', 'gn']]) {
    const list = items.filter(i => i.source === src);
    $('n-' + el).textContent = `(${list.length})`;
    $(el).innerHTML = list.map(i => `
      <li id="${esc(i.id)}">
        <a href="${esc(i.link)}" target="_blank" rel="noopener">${esc(i.title)}</a>
        <div class="sub">${i.price ? `<span class="price">${esc(i.price)}</span> · ` : ''}${esc(i.shop)}${i.category ? ' · ' + esc(i.category) : ''} · ${esc(i.published.slice(5, 16).replace('T', ' '))}</div>
        <div class="why"></div>
      </li>`).join('');
  }
}

function mark(id, keep, why) {
  const li = document.getElementById(id);
  if (!li) return;
  li.classList.toggle('dim', !keep);
  li.querySelector('.why').textContent = keep && why ? '✓ ' + why : '';
}

function showAll() {
  document.querySelectorAll('li').forEach(li => { li.classList.remove('dim', 'hidden'); li.querySelector('.why').textContent = ''; });
  status('');
}

function keywordFilter() {
  const words = getInterests();
  let n = 0;
  for (const i of items) {
    const hit = words.find(w => i.title.includes(w));
    mark(i.id, !!hit, hit ? `키워드 "${hit}"` : '');
    if (hit) n++;
  }
  status(`키워드 일치 ${n}건 (나머지는 흐리게 표시)`);
}

// ---------- Chrome 내장 AI ----------
// 한국어를 바로 못 받는 경우를 대비해: 한국어 → 영어 번역(Translator API) 후 판단(Prompt API)
const LM_OPTS = lang => ({
  expectedInputs: [{ type: 'text', languages: [lang] }],
  expectedOutputs: [{ type: 'text', languages: ['en'] }],
});
const SCHEMA = {
  type: 'object',
  properties: { match: { type: 'boolean' }, reason: { type: 'string' } },
  required: ['match', 'reason'],
};

// 페이지를 열 때 상태 진단 (버튼을 누르지 않아도 확인 가능)
async function diagnose() {
  const parts = [`secure=${isSecureContext}`];
  parts.push('LanguageModel' in self ? `LM=${await LanguageModel.availability(LM_OPTS('en')).catch(e => e.name)}` : 'LM=없음');
  parts.push('Translator' in self
    ? `번역=${await Translator.availability({ sourceLanguage: 'ko', targetLanguage: 'en' }).catch(e => e.name)}`
    : '번역=없음');
  $('diag').textContent = '내장 AI 상태: ' + parts.join(' · ');
}

async function aiFilter() {
  if (!('LanguageModel' in self) || !('Translator' in self)) {
    return status('이 브라우저에서는 내장 AI를 쓸 수 없어요. Chrome 148 이상에서 http://localhost 또는 https 주소로 열어주세요.');
  }
  try {
    const words = getInterests();
    status('모델 준비 중… (처음이면 다운로드 때문에 오래 걸려요)');
    // create()는 버튼 클릭 직후(user activation 유효할 때) 바로 호출해야 해서, 다른 await보다 먼저 둘 다 시작
    const [translator, base] = await Promise.all([
      Translator.create({ sourceLanguage: 'ko', targetLanguage: 'en',
        monitor(m) { m.addEventListener('downloadprogress', e => status(`번역 모델 다운로드 ${Math.round(e.loaded * 100)}%`)); } }),
      LanguageModel.create({ ...LM_OPTS('en'),
        monitor(m) { m.addEventListener('downloadprogress', e => status(`언어 모델 다운로드 ${Math.round(e.loaded * 100)}%`)); } }),
    ]);
    const lang = 'en';
    const tr = s => translator.translate(s);
    const interestText = await tr(words.join(', '));
    const system = `You filter shopping deals and news headlines for one user. The user's interests: ${interestText}. ` +
      `Answer match=true only if the item is about buying something the user is interested in at a discount ` +
      `(a deal, sale, coupon or price cut). Store openings, events, stock news and overseas-only sales are false. ` +
      `Keep reason under 10 words.`;
    await runItems(tr, base, system, lang);
  } catch (e) {
    status(`AI 실행 실패: ${e.name} — ${e.message}`);
    console.error(e);
  }
}

async function runItems(tr, base, system, lang) {

  let n = 0, done = 0;
  const t0 = performance.now();
  for (const i of items) {
    try {
      const title = await tr(i.title);
      const s = await base.clone();             // 항목마다 대화 기록을 비운 상태로
      const out = JSON.parse(await s.prompt(`${system}\n\nItem (${i.source === '뉴스' ? 'news headline' : 'deal post'}): ${title}`,
                                            { responseConstraint: SCHEMA }));
      s.destroy();
      mark(i.id, out.match, out.reason);
      if (out.match) n++;
    } catch (e) {
      mark(i.id, true, '판단 실패: ' + e.message);
    }
    done++;
    status(`AI 판단 중 ${done}/${items.length} · 일치 ${n}건`);
  }
  status(`AI 판단 완료: ${n}/${items.length}건 일치 · ${((performance.now() - t0) / 1000).toFixed(1)}초 (${lang === 'en' ? '번역 후 판단' : '한국어 그대로 판단'})`);
}

load().catch(e => status('data.json을 불러오지 못했어요: ' + e.message));
diagnose().catch(e => { $('diag').textContent = '내장 AI 상태 확인 실패: ' + e.message; });
</script>
</body>
</html>
