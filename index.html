<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LLM Tracker</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }
    main {
      text-align: center;
      padding: 2rem;
    }
    h1 {
      font-size: 2.5rem;
      margin: 0 0 0.5rem;
    }
    p {
      color: #94a3b8;
      margin: 0.25rem 0;
    }
    a {
      color: #38bdf8;
    }
  </style>
</head>
<body>
  <main>
    <h1>LLM Tracker</h1>
    <p>GitHub Pages 배포 테스트 페이지입니다.</p>
    <p>이 화면이 보인다면 배포가 정상적으로 완료된 것입니다. 🎉</p>
    <p id="time"></p>
  </main>
  <script>
    document.getElementById("time").textContent =
      "접속 시각: " + new Date().toLocaleString("ko-KR");
  </script>
</body>
</html>
